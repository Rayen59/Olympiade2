<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>
    <style>
        @import url(https://fonts.googleapis.com/css?family=Sniglet|Raleway:900);

        body, html {
            height: 100%;
            padding: 0;
            margin: 0;
            font-family: 'Sniglet', cursive;
        }
        h1 {
            font-weight: normal;
            font-size: 4em;
            font-family: 'Raleway', sans-serif;
            margin: 0 auto;
            margin-top: 30px;
            width: 500px;
            color: #F90;
            text-align: center;
        }

        /* Animation webkit */
        @-webkit-keyframes myfirst {
            0% {margin-left: -235px}
            90% {margin-left: 100%;}
            100% {margin-left: 100%;}
        }

        /* Animation */
        @keyframes myfirst {
            0% {margin-left: -235px}
            70% {margin-left: 100%;}
            100% {margin-left: 100%;}
        }

        .fish {
            background-image: url('http://www.geertjanhendriks.nl/codepen/form/fish.png');
            width: 235px;
            height: 104px;
            margin-left: -235px;
            position: absolute;    
            animation: myfirst 24s;
            -webkit-animation: myfirst 24s;
            animation-iteration-count: infinite;
            -webkit-animation-iteration-count: infinite;
            animation-timing-function: linear;
            -webkit-animation-timing-function: linear;
        }

        #fish {
            top: 120px;
        }

        #fish2 {
            top: 260px;
            animation-delay: 12s;
            -webkit-animation-delay: 12s;
        }

        header {
            height: 160px;
            background: url('http://www.geertjanhendriks.nl/codepen/form/golf.png') repeat-x bottom;
        }

        #form {
            height: 100%;    
            background-color: #98d4f3;
            overflow: hidden;
            position: relative;
        }
        form {
            margin: 0 auto;
            width: 500px;
            padding-top: 40px;
            color: white;
            position: relative;
        }
        label, input, textarea {
            display: block;    
        }
        input, textarea {
            width: 500px;    
            border: none;
            border-radius: 20px;
            outline: none;
            padding: 10px;
            font-family: 'Sniglet', cursive;
            font-size: 1em;
            color: #676767;
            transition: border 0.5s;
            -webkit-transition: border 0.5s;
            -moz-transition: border 0.5s;
            -o-transition: border 0.5s;
            border: solid 3px #98d4f3;    
            -webkit-box-sizing:border-box;
            -moz-box-sizing:border-box;
            box-sizing:border-box;
        }
        input:focus, textarea:focus {
            border: solid 3px #77bde0;    
        }

        textarea {
            height: 100px;    
            resize: none; 
            overflow: auto;
        }
        input[type="submit"] {
            background-color: #F90;
            color: white;
            height: 50px;
            cursor: pointer;
            margin-top: 30px;
            font-size: 1.29em;
            font-family: 'Sniglet', cursive;
            -webkit-transition: background-color 0.5s;
            -moz-transition: background-color 0.5s;
            -o-transition: background-color 0.5s;
            transition: background-color 0.5s;
        }
        input[type="submit"]:hover {
            background-color: #e58f0e;
        }
        label {
            font-size: 1.5em;
            margin-top: 20px;
            padding-left: 20px;
        }
        .formgroup, .formgroup-active, .formgroup-error {
            background-repeat: no-repeat;
            background-position: right bottom;
            background-size: 10.5%;
            transition: background-image 0.7s;
            -webkit-transition: background-image 0.7s;
            -moz-transition: background-image 0.7s;
            -o-transition: background-image 0.7s;
            width: 566px;
            padding-top: 2px;
        }

        .formgroup {
            background-image: url('http://www.geertjanhendriks.nl/codepen/form/pixel.gif');    
        }
        .formgroup-active {
            background-image: url('http://www.geertjanhendriks.nl/codepen/form/octo.png');
        }
        .formgroup-error {
            background-image: url('http://www.geertjanhendriks.nl/codepen/form/octo-error.png');
            color: red;
        }
    </style>
</head>
<body>

<!-- Back Arrow Navigation -->
<style>
.global-back-btn {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 99999;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 15px;
    background: rgba(15, 23, 42, 0.92);
    color: #ffffff !important;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 9999px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none !important;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
}
.global-back-btn:hover {
    background: #0f172a;
    color: #38bdf8 !important;
    transform: translateX(-3px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
}
@media (max-width: 640px) {
    .global-back-btn {
        top: 10px;
        left: 10px;
        padding: 6px 12px;
        font-size: 12px;
    }
}
</style>
<button type="button" onclick="goBackPage()" class="global-back-btn" title="Revenir en arrière" aria-label="Revenir en arrière">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>Retour</span>
</button>
<script>
function goBackPage() {
    var ref = document.referrer;
    if (ref && ref.indexOf(window.location.host) !== -1 && ref !== window.location.href) {
        var startLoc = window.location.href;
        window.history.back();
        setTimeout(function() {
            if (window.location.href === startLoc) {
                window.location.href = ref;
            }
        }, 150);
    } else {
        window.location.href = 'index.html';
    }
}
</script>

    <header>
        <h1>Contact us</h1>
    </header>
    
    <div id="form">
        <div class="fish" id="fish"></div>
        <div class="fish" id="fish2"></div>
        
        <form id="waterform" action="mailto:matholympiad40@gmail.com" method="post" enctype="text/plain">
            <div class="formgroup" id="name-form">
                <label for="name">Your name*</label>
                <input type="text" id="name" name="name" required />
            </div>
            
            <div class="formgroup" id="email-form">
                <label for="email">Your e-mail*</label>
                <input type="email" id="email" name="email" required />
            </div>
            
            <div class="formgroup" id="message-form">
                <label for="message">Your message</label>
                <textarea id="message" name="message"></textarea>
            </div>
            
            <input type="submit" value="Send your message!" />
        </form>
    </div>
</body>
</html>
