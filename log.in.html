<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login Form using HTML CSS Only | Codehal</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1f293a;
}
.container {
    position: relative;
    width: 256px;
    height: 256px;
    display: flex;
    justify-content: center;
    align-items: center;
}
.container span {
    position: absolute;
    left: 0;
    width: 32px;
    height: 6px;
    background: #2c4766;
    border-radius: 8px;
    transform-origin: 128px;
    transform: scale(2.2) rotate(calc(var(--i) * (360deg / 50)));
    animation: animateBlink 3s linear infinite;
    animation-delay: calc(var(--i) * (3s / 50));
}
@keyframes animateBlink {
    0% {
        background: #0ef;
    }
    25% {
        background: #2c4766;
    }
}
.login-box {
    position: absolute;
    width: 400px;
}
.login-box form {
    width: 100%;
    padding: 0 50px;
}
h2 {
    font-size: 2em;
    color: #0ef;
    text-align: center;
}
.input-box {
    position: relative;
    margin: 25px 0;
}
.input-box input {
    width: 100%;
    height: 50px;
    background: transparent;
    border: 2px solid #2c4766;
    outline: none;
    border-radius: 40px;
    font-size: 1em;
    color: #fff;
    padding: 0 20px;
    transition: .5s ease;
}
.input-box input:focus,
.input-box input:valid {
    border-color: #0ef;
}
.input-box label {
    position: absolute;
    top: 50%;
    left: 20px;
    transform: translateY(-50%);
    font-size: 1em;
    color: #fff;
    pointer-events: none;
    transition: .5s ease;
}
.input-box input:focus~label,
.input-box input:valid~label {
    top: 1px;
    font-size: .8em;
    background: #1f293a;
    padding: 0 6px;
    color: #0ef;
}
.forgot-pass {
    margin: -15px 0 10px;
    text-align: center;
}
.forgot-pass a {
    font-size: .85em;
    color: #fff;
    text-decoration: none;
}
.forgot-pass a:hover {
    text-decoration: underline;
}
.btn {
    width: 100%;
    height: 45px;
    background: #0ef;
    border: none;
    outline: none;
    border-radius: 40px;
    cursor: pointer;
    font-size: 1em;
    color: #1f293a;
    font-weight: 600;
}
.signup-link {
    margin: 20px 0 10px;
    text-align: center;
}
.signup-link a {
    font-size: 1em;
    color: #0ef;
    text-decoration: none;
    font-weight: 600;
}
.signup-link a:hover {
    text-decoration: underline;
}
.message {
    text-align: center;
    font-size: 1.2em;
    color: #fff;
    margin-top: 20px;
    background-color: rgba(0, 0, 0, 0.7);
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 0 10px #0ef, 0 0 20px #0ef, 0 0 30px #0ef;
    animation: fadeIn 2s ease-in-out;
}

@keyframes fadeIn {
    0% {
        opacity: 0;
    }
    100% {
        opacity: 1;
    }
}
</style>
<body>

<!-- Back Arrow Navigation -->
<style>
.global-back-btn {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 99999;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 15px;
    background: rgba(15, 23, 42, 0.92);
    color: #ffffff !important;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 9999px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none !important;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
}
.global-back-btn:hover {
    background: #0f172a;
    color: #38bdf8 !important;
    transform: translateX(-3px);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
}
@media (max-width: 640px) {
    .global-back-btn {
        top: 10px;
        left: 10px;
        padding: 6px 12px;
        font-size: 12px;
    }
}
</style>
<button type="button" onclick="goBackPage()" class="global-back-btn" title="Revenir en arrière" aria-label="Revenir en arrière">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>Retour</span>
</button>
<script>
function goBackPage() {
    var ref = document.referrer;
    if (ref && ref.indexOf(window.location.host) !== -1 && ref !== window.location.href) {
        var startLoc = window.location.href;
        window.history.back();
        setTimeout(function() {
            if (window.location.href === startLoc) {
                window.location.href = ref;
            }
        }, 150);
    } else {
        window.location.href = 'index.html';
    }
}
</script>

    <div class="container">
        <div class="login-box">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="input-box">
                    <input type="email" id="email" required autocomplete="email">
                    <label>Email</label>
                </div>
                <div class="input-box">
                    <input type="password" id="password" required autocomplete="current-password">
                    <label>Password</label>
                </div>
                <button type="submit" class="btn" id="loginBtn">Connexion</button>
                <div class="signup-link">
                    <a href="index.html">Retour à l'accueil</a>
                </div>
            </form>
            <div id="message" class="message" style="display: none;"></div>
        </div>
        <!-- Animated span elements -->
        <span style="--i:0;"></span>
        <span style="--i:1;"></span>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var msgEl = document.getElementById('message');
            var btn = document.getElementById('loginBtn');

            msgEl.style.display = 'block';
            msgEl.textContent = 'Connexion en cours...';
            msgEl.style.color = '#0ef';
            btn.disabled = true;

            try {
                var res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                var data = await res.json();

                if (!res.ok) {
                    msgEl.textContent = data.error || 'Identifiants invalides.';
                    msgEl.style.color = '#ff6b6b';
                    btn.disabled = false;
                    return;
                }

                localStorage.setItem('mk_user_id', data.user.id);
                msgEl.textContent = 'Connexion réussie ! Redirection...';
                msgEl.style.color = '#0ef';

                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 800);
            } catch (err) {
                msgEl.textContent = 'Erreur réseau ou serveur inaccessible.';
                msgEl.style.color = '#ff6b6b';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
